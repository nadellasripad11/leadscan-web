<svg width="800" height="160" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0f0c29"/>
      <stop offset="50%"  stop-color="#1a1b3a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7dcfff"/>
      <stop offset="100%" stop-color="#9ece6a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="160" fill="url(#bg)"/>
