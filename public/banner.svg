  <line x1="140" y1="0" x2="140" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="210" y1="0" x2="210" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="280" y1="0" x2="280" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="350" y1="0" x2="350" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="420" y1="0" x2="420" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="490" y1="0" x2="490" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="560" y1="0" x2="560" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="630" y1="0" x2="630" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="770" y1="0" x2="770" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="32" x2="800" y2="32" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="64" x2="800" y2="64" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="96" x2="800" y2="96" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="128" x2="800" y2="128" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <line x1="0" y1="160" x2="800" y2="160" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <!-- Terminal icon -->
  <rect x="48" y="52" width="60" height="56" rx="8" fill="none" stroke="#7dcfff" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="78" y="83" text-anchor="middle" font-size="13" fill="#7dcfff" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace" opacity="0.8">$_</text>
  <!-- Title -->
  <text x="128" y="86" font-size="44" font-weight="bold" fill="url(#textGrad)" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace" letter-spacing="-1">leadscan</text>
  <!-- Tagline -->
  <text x="128" y="112" font-size="15" fill="#565f89" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace">AI-powered company intelligence from your terminal</text>
  <!-- npm badge area hint -->
  <rect x="128" y="125" width="480" height="20" rx="3" fill="#ffffff" fill-opacity="0.03"/>
  <text x="136" y="139" font-size="11" fill="#565f89" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace">npm install -g leadscan   ·   npx leadscan analyze &lt;domain&gt;</text>
