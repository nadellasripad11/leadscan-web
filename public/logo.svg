<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b9eff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="40" fill="url(#bgGrad)"/>

  <!-- Company building silhouette -->
  <rect x="60" y="80" width="80" height="70" rx="4" fill="white" opacity="0.9"/>

  <!-- Windows/data points in building -->
  <rect x="75" y="95" width="12" height="12" fill="#2563eb" opacity="0.8"/>
  <rect x="95" y="95" width="12" height="12" fill="#2563eb" opacity="0.6"/>
  <rect x="113" y="95" width="12" height="12" fill="#2563eb" opacity="0.8"/>

  <rect x="75" y="118" width="12" height="12" fill="#2563eb" opacity="0.7"/>
  <rect x="95" y="118" width="12" height="12" fill="#2563eb" opacity="0.9"/>
  <rect x="113" y="118" width="12" height="12" fill="#2563eb" opacity="0.7"/>

  <!-- Magnifying glass overlay (scanning) -->
  <circle cx="145" cy="65" r="20" fill="none" stroke="white" stroke-width="3" opacity="0.8"/>
  <line x1="160" y1="50" x2="172" y2="38" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Checkmark inside glass (found/verified) -->
  <path d="M 138 65 L 142 70 L 151 60" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
</svg>
